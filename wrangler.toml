# Cloudflare Pages 配置（wrangler v3+）。
# Pages 项目首次通过 `npx wrangler pages deploy` 部署时会读取本文件。
# dashboard Git 集成方式绑定 D1 与环境变量，见 README「部署到 Cloudflare Pages」。
name = "blog"
compatibility_date = "2025-05-01"
pages_build_output_dir = "web/dist"

[[d1_databases]]
binding = "DB"
database_name = "blog-db"
# 建立数据库后，把 wrangler d1 create 输出的 database_id 填在这里
database_id = "c7029e93-9b79-46c0-aee5-3fbb3109f406"
