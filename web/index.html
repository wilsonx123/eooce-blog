<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 標題與描述為佔位值：前端加載網站設定後動態更新（標籤頁標題隨 site_title、描述隨 site_subtitle） -->
    <meta name="description" content="Just For Fun" />
    <meta name="theme-color" content="#185a56" />
    <title>LittleCLS</title>
    <!-- 重複到訪者：以本地快取站名即時更換佔位標題，避免重新整理時閃現舊值（與 site store 同一快取鍵） -->
    <script>
      ;(function () {
        try {
          var site = JSON.parse(localStorage.getItem('blog_site_cache') || 'null')
          var title = site && typeof site.site_title === 'string' ? site.site_title.trim() : ''
          if (title) document.title = title
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('blog_theme')
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
